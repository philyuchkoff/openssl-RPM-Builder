name: Build OpenSSL 4.x RPM and publish release

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenSSL version (e.g. 4.0.1). Empty = latest release'
        required: false
        default: ''
        type: string
      force:
        description: 'Rebuild and re-upload even if the release already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: openssl-rpm-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: almalinux:8

    steps:
      - name: Install tools
        run: |
          dnf -y install epel-release
          dnf -y install git jq curl rpm-build make gcc gcc-c++ perl perl-IPC-Cmd perl-Text-Template perl-Test-Simple zlib-devel ca-certificates perl-libwww-perl

      - name: Detect OpenSSL version
        id: detect
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "Manual build of version: $VERSION"
          else
            VERSION=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              https://api.github.com/repos/openssl/openssl/releases/latest \
              | jq -r '.tag_name' | sed 's/^openssl-//')
            CURRENT=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest \
              | jq -r '.tag_name' | sed 's/^openssl-//' || true)
            if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
              CURRENT=""
            fi
            echo "Latest OpenSSL release: $VERSION"
            echo "Current release in this repo: ${CURRENT:-none}"
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not determine the OpenSSL version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_VERSION" ] || [ "$INPUT_FORCE" = "true" ]; then
            SHOULD_BUILD=true
          elif [ -z "$CURRENT" ] || [ "$VERSION" != "$CURRENT" ]; then
            SHOULD_BUILD=true
          else
            SHOULD_BUILD=false
          fi
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - name: Skip (already built)
        if: steps.detect.outputs.should_build == 'false'
        run: |
          echo "OpenSSL ${{ steps.detect.outputs.version }} is already released. Skipping."

      - name: Build OpenSSL RPM
        if: steps.detect.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail

          BUILD_ROOT="/tmp/rpmbuild"
          DISTR_DIR="/distr"
          mkdir -p "$BUILD_ROOT"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "$DISTR_DIR"

          echo "Building OpenSSL ${VERSION}..."

          DOWNLOAD_SUCCESS=0

          if curl -sSfL "https://www.openssl.org/source/openssl-${VERSION}.tar.gz" \
            -o "${BUILD_ROOT}/SOURCES/openssl-${VERSION}.tar.gz"; then
            echo "Downloaded from openssl.org"
            curl -sSfL "https://www.openssl.org/source/openssl-${VERSION}.tar.gz.sha256" \
              -o "${BUILD_ROOT}/SOURCES/openssl-${VERSION}.tar.gz.sha256" || true
            DOWNLOAD_SUCCESS=1
          fi

          if [ $DOWNLOAD_SUCCESS -eq 0 ]; then
            echo "Trying GitHub releases..."
            if curl -sSfL "https://github.com/openssl/openssl/releases/download/openssl-${VERSION}/openssl-${VERSION}.tar.gz" \
              -o "${BUILD_ROOT}/SOURCES/openssl-${VERSION}.tar.gz"; then
              echo "Downloaded from GitHub"
              DOWNLOAD_SUCCESS=1
            fi
          fi

          if [ $DOWNLOAD_SUCCESS -eq 0 ]; then
            echo "Trying old directory..."
            if curl -sSfL "https://www.openssl.org/source/old/${VERSION}/openssl-${VERSION}.tar.gz" \
              -o "${BUILD_ROOT}/SOURCES/openssl-${VERSION}.tar.gz"; then
              echo "Downloaded from old directory"
              DOWNLOAD_SUCCESS=1
            fi
          fi

          if [ $DOWNLOAD_SUCCESS -eq 0 ]; then
            echo "ERROR: Failed to download OpenSSL ${VERSION}" >&2
            exit 1
          fi

          if [ -f "${BUILD_ROOT}/SOURCES/openssl-${VERSION}.tar.gz.sha256" ]; then
            cd "${BUILD_ROOT}/SOURCES"
            sha256sum -c "openssl-${VERSION}.tar.gz.sha256"
            cd -
            echo "SHA256 checksum OK"
          fi

          cat << SPECEOF > "${BUILD_ROOT}/SPECS/openssl4.spec"
          Summary: OpenSSL %{version} for CentOS/RHEL (parallel installation)
          Name: openssl4
          Version: %{?version}%{!?version:${VERSION}}
          Release: 1%{?dist}
          URL: https://www.openssl.org/
          License: Apache-2.0

          %define debug_package %{nil}
          %global __requires_exclude ^perl\\(.*\\)$

          Source0: openssl-%{version}.tar.gz
          BuildRequires: make gcc gcc-c++ perl perl-IPC-Cmd zlib-devel perl-libwww-perl

          %description
          OpenSSL RPM for version %{version} (4.x series) on CentOS/RHEL
          This package installs alongside the system OpenSSL and does not replace it.

          %prep
          %setup -q -n openssl-%{version}

          %build
          ./config \
              --prefix=/usr/openssl4 \
              --openssldir=/usr/openssl4 \
              --libdir=lib64 \
              zlib \
              enable-tls1_3 \
              enable-ec_nistp_64_gcc_128 \
              no-weak-ssl-ciphers \
              no-ssl3 \
              no-ssl3-method \
              shared
          make -j\$(nproc)

          %install
          rm -rf %{buildroot}
          %make_install

          install -d %{buildroot}/usr/bin
          install -d %{buildroot}/usr/lib64

          ln -sf ../openssl4/bin/openssl %{buildroot}/usr/bin/openssl4
          ln -sf ../openssl4/lib64/libssl.so %{buildroot}/usr/lib64/libssl.so.4
          ln -sf ../openssl4/lib64/libcrypto.so %{buildroot}/usr/lib64/libcrypto.so.4

          %files
          /usr/bin/openssl4
          /usr/lib64/libssl.so.4
          /usr/lib64/libcrypto.so.4
          /usr/openssl4

          %post -p /sbin/ldconfig
          %postun -p /sbin/ldconfig
          SPECEOF

          rpmbuild -ba \
            --define "_topdir ${BUILD_ROOT}" \
            --define "version ${VERSION}" \
            "${BUILD_ROOT}/SPECS/openssl4.spec"

          find "${BUILD_ROOT}/RPMS" -name "*.rpm" -exec cp {} "${DISTR_DIR}/" \;

          echo "Build complete! RPM packages:"
          find "${DISTR_DIR}" -name "*.rpm" -exec basename {} \;

          cd "$DISTR_DIR"
          sha256sum *.rpm > SHA256SUMS
          cd -
          cat "$DISTR_DIR/SHA256SUMS"

      - name: Upload to GitHub Releases
        if: steps.detect.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DISTR_DIR="/distr"
          REPO="$GITHUB_REPOSITORY"

          RHEL_VER=$(rpm --eval '%{rhel}')

          RELEASE_BODY=$(cat << EOFBODY
          Build of [OpenSSL ${VERSION}](https://github.com/openssl/openssl/releases/tag/openssl-${VERSION}) for CentOS/RHEL ${RHEL_VER}.

          The RPM package installs **alongside** the system OpenSSL — to \`/usr/openssl4\`.
          See [README](https://github.com/${REPO}#openssl-${VERSION//./}) for details.

          \`\`\`
          $(cat "${DISTR_DIR}/SHA256SUMS")
          \`\`\`
          EOFBODY
          )

          TAG="openssl-${VERSION}"

          EXISTING=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" || true)
          RELEASE_ID=$(echo "$EXISTING" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release ${TAG}"
            PAYLOAD=$(jq -n \
              --arg tag "$TAG" \
              --arg name "OpenSSL ${VERSION} for CentOS/RHEL" \
              --arg body "$RELEASE_BODY" \
              '{tag_name:$tag, name:$name, body:$body}')
            RELEASE_ID=$(curl -fsSL -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/${REPO}/releases" | jq -r '.id')
          else
            echo "Release ${TAG} already exists (id=${RELEASE_ID}), updating assets"
          fi

          ASSETS=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets")

          for f in "${DISTR_DIR}"/*.rpm "${DISTR_DIR}/SHA256SUMS"; do
            NAME=$(basename "$f")
            ASSET_ID=$(echo "$ASSETS" | jq -r --arg n "$NAME" '.[] | select(.name==$n) | .id' | head -1)
            if [ -n "$ASSET_ID" ]; then
              echo "Deleting old asset ${NAME} (id=${ASSET_ID})"
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}" || true
            fi
            echo "Uploading ${NAME}"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${NAME}"
          done

          echo "Done: https://github.com/${REPO}/releases/tag/${TAG}"
